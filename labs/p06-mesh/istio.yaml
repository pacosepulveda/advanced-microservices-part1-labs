apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: p06-inventory
spec:
  exportTo: ["."]
  host: p06-inventory
  subsets:
  - name: v1
    labels: {version: v1}
  - name: v2
    labels: {version: v2}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: p06-inventory
spec:
  exportTo: ["."]
  hosts: [p06-inventory]
  gateways: [mesh]
  http:
  - route:
    - destination: {host: p06-inventory, subset: v1}
      weight: 100
    - destination: {host: p06-inventory, subset: v2}
      weight: 0
